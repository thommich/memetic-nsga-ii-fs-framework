[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memetic-fs"
version = "0.1.0"
description = "Full-row temporal LightGBM feature selection with memetic NSGA-II"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4", "scikit-learn>=1.4,<2", "lightgbm>=4.5,<5", "pymoo>=0.6.2,<0.7", "joblib>=1.4,<2", "psutil>=6,<8", "pyarrow>=16", "plotly>=6,<7", "PyYAML>=6,<7", "threadpoolctl>=3"]

[project.optional-dependencies]
dev = ["pytest>=8", "build", "nbformat", "nbclient", "ipykernel"]

[project.scripts]
memetic-fs = "memetic_fs.cli:main"

[tool.setuptools.packages.find]
include = ["memetic_fs*"]

[tool.setuptools.package-data]
memetic_fs = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
